    <script>
      // Play the full intro on a new visit or a manual reload.
      // Returning to the homepage within the same tab skips the intro.
      (() => {
        const navType = performance.getEntriesByType('navigation')[0]?.type;
        let visited = false;
        try {
          visited = sessionStorage.getItem('mbandurian-home-seen') === '1';
          sessionStorage.setItem('mbandurian-home-seen', '1');
        } catch (_) { /* Storage can be unavailable in privacy-restricted contexts. */ }
        if (visited && navType !== 'reload') {
          document.documentElement.classList.add('home-skip-intro');
        }
      })();
    </script>

<script>
  // Refined composition: give the headline room, then reveal grouped scale-in card waves, then the star.
  document.addEventListener('DOMContentLoaded', () => {
    const page = document.body;
    const root = document.documentElement;
    const cards = [...document.querySelectorAll('.page-portfolio .grid-item')];
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const skipIntro = root.classList.contains('home-skip-intro');
    const later = ms => new Promise(resolve => setTimeout(resolve, ms));
    // Load the exact display font before revealing the heading on either path.
    const fontReady = document.fonts?.load
      ? document.fonts.load('800 48px Unbounded').catch(() => {})
      : Promise.resolve();

    // Returning: show the interface immediately, but animate the star only
    // once the GLB has actually loaded, preventing a one-frame flash.
    if (skipIntro) {
      fontReady.then(() => {
        root.classList.add('home-title-font-ready');
        page.classList.add('home-title-visible');
      });
      const showReturnStar = () => page.classList.add('home-star-visible');
      if (window.homeStarReady === true) showReturnStar();
      else window.addEventListener('home-star-ready', showReturnStar, { once: true });
      return;
    }

    // Group cards into broad diagonal bands: multiple cards reveal together.
    // Preserve original scale(0) -> scale(1) animation instead of sliding.
    cards.forEach((card, i) => {
      const col = i % 8;
      const row = Math.floor(i / 8);
      const band = Math.floor((col + row * 1.7) / 2.2);
      card.style.setProperty('--home-wave-delay', `${(1.15 + band * 0.13).toFixed(2)}s`);
    });

    let modelReady = window.homeStarReady === true;
    let starCueReached = false;
    const revealStar = () => {
      if (modelReady && starCueReached) page.classList.add('home-star-visible');
    };
    window.addEventListener('home-star-ready', () => {
      modelReady = true;
      revealStar();
    });

    (async () => {
      if (!reduceMotion) await later(320);
      await fontReady;
      root.classList.add('home-title-font-ready');
      // The cursor-driven heading effect only starts after its intro ends.
      if (!reduceMotion) await later(950);
      page.classList.add('home-title-visible');
    })();

    (async () => {
      if (!reduceMotion) await later(2150);
      starCueReached = true;
      revealStar();
    })();
  });

  // A browser back/forward cache restores the original document rather
  // than loading a new one. Make sure the intro cannot replay on return.
  window.addEventListener('pageshow', (event) => {
    if (!event.persisted) return;
    document.documentElement.classList.add('home-skip-intro');
    const revealRestoredTitle = () => {
      document.documentElement.classList.add('home-title-font-ready');
      document.body.classList.add('home-title-visible');
    };
    if (document.fonts?.check('800 48px Unbounded')) revealRestoredTitle();
    else if (document.fonts?.load) document.fonts.load('800 48px Unbounded').then(revealRestoredTitle, revealRestoredTitle);
    else revealRestoredTitle();
    // A BFCache restoration does not reload the GLB. Restart only the short
    // return animation after the restored page has painted.
    document.body.classList.remove('home-star-visible');
    requestAnimationFrame(() => requestAnimationFrame(() => {
      document.body.classList.add('home-star-visible');
    }));
    document.body.classList.remove('page-transitioning');
    document.querySelectorAll('.transition-overlay').forEach(el => el.remove());
  });
</script>
